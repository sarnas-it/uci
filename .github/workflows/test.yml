name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: go test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "$files"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
